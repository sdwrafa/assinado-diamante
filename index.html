<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uma surpresa para você</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section class="intro" id="intro">
        <p class="eyebrow">Dia dos Namorados</p>
        <h1>Tenho uma surpresa para você</h1>
        <button class="surprise-button" id="surpriseButton" type="button">
          Clique aqui para receber sua surpresa
        </button>
      </section>

      <section class="surprise" id="surprise" hidden>
        <div class="sunflower" aria-hidden="true">
          <div class="glow"></div>
          <div class="stem">
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
          </div>
          <div class="bloom">
            <span class="petal petal-1"></span>
            <span class="petal petal-2"></span>
            <span class="petal petal-3"></span>
            <span class="petal petal-4"></span>
            <span class="petal petal-5"></span>
            <span class="petal petal-6"></span>
            <span class="petal petal-7"></span>
            <span class="petal petal-8"></span>
            <span class="petal petal-9"></span>
            <span class="petal petal-10"></span>
            <span class="petal petal-11"></span>
            <span class="petal petal-12"></span>
            <span class="petal petal-13"></span>
            <span class="petal petal-14"></span>
            <span class="petal petal-15"></span>
            <span class="petal petal-16"></span>
            <div class="center">
              <span></span>
            </div>
          </div>
        </div>

        <div class="message">
          <p class="eyebrow">Para o meu amor</p>
          <h2>Você ilumina meus dias.</h2>
          <p>
            Assim como um girassol procura o sol, meu coração sempre encontra
            você. Feliz Dia dos Namorados.
          </p>
          <button class="reset-button" id="resetButton" type="button">
            Ver de novo
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
